[apple-emoji]
fetch.url = "https://github.com/samuelngs/apple-emoji-linux/releases/download/$ver/AppleColorEmoji-Linux.ttf"
src.github = "samuelngs/apple-emoji-linux"

[broadcast-box]
fetch.github = "Glimesh/broadcast-box"
src.git = "https://github.com/Glimesh/broadcast-box.git"

[maloja]
docker.arch = "arm64"
docker.os = "linux"
fetch.docker = "krateng/maloja"
src.container = "krateng/maloja"
src.include_regex = '^\d+\.\d+\.\d+$'
src.sort_version_key = "parse_version"

[modern-minimal-ui-sounds]
fetch.github = "cadecomposer/modern-minimal-ui-sounds"
src.github = "cadecomposer/modern-minimal-ui-sounds"

[romm]
docker.arch = "arm64"
docker.os = "linux"
fetch.docker = "rommapp/romm"
src.container = "rommapp/romm"
src.include_regex = '^\d+\.\d+\.\d+$'
src.sort_version_key = "parse_version"

[romp]
cargo_lock = ["Cargo.lock"]
fetch.github = "RompEmu/RomP"
src.github = "RompEmu/RomP"
